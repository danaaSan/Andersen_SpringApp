<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User Menu</title>
  <style>
    /* General Page Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff; /* Light blue background for better visibility */
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 20px;
      color: #1e90ff; /* Blue color for the heading */
    }

    div {
      margin-top: 50px;
    }

    /* Button Styling */
    button {
      background-color: #1e90ff; /* Dodger Blue */
      color: white;
      border: none;
      padding: 15px 30px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 1em;
      margin: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #4682b4; /* Slightly darker blue on hover */
      transform: scale(1.05);
    }

    a {
      text-decoration: none;
    }

    /* Back Button Specific Styling */
    a:last-child button {
      background-color: #ff6347; /* Tomato color for the Back button */
    }

    a:last-child button:hover {
      background-color: #ff4500; /* Darker tomato red on hover */
    }
  </style>
</head>
<body>
<h1>Welcome to the User Menu</h1>
<div>
  <a th:href="@{/availableSpaces}">
    <button>View Available Spaces</button>
  </a>
  <a th:href="@{/addBooking}">
    <button>Make Booking</button>
  </a>
  <a th:href="@{/selectUser}">
    <button>View my Bookings</button>
  </a>
  <a th:href="@{/selectUser}">
    <button>Cancel Booking</button>
  </a>
</div>
<a th:href="@{/}">
  <button>Back to Main Menu</button>
</a>
</body>
</html>
