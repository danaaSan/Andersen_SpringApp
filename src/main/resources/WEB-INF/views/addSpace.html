<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Coworking Space</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>Add Coworking Space</h1>

<form action="#" th:action="@{/}" th:object="${spaceInput}" method="post">
    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required /><br><br>

    <label>Type:</label>
    <select th:field="*{type}">
        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
    </select><br><br>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <button type="submit">Add</button>
</form>


<a th:href="@{/spaces}">Back to list</a>
</body>
</html>
